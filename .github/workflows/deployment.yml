name: Deployment validation

on:
  pull_request:
    paths:
      - 'deployment/**'
      - 'scripts/**'
      - '.github/workflows/deployment.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/**'
      - 'scripts/**'
      - '.github/workflows/deployment.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Validate Compose files
        run: |
          docker compose -f deployment/docker-compose.yml config --quiet
          BACKEND_IMAGE=ghcr.io/mephisto-nox/radar-pulse-vis/backend:test FRONTEND_IMAGE=ghcr.io/mephisto-nox/radar-pulse-vis/frontend:test docker compose -f deployment/docker-compose.prod.yml config --quiet
      - name: Validate Kubernetes manifests
        run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 -strict -summary deployment/kubernetes/*.yaml
