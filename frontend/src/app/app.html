<div class="app-shell">
  <aside class="sidebar" [attr.aria-label]="i18n.language() === 'de' ? 'Hauptnavigation' : 'Main navigation'">
    <a class="brand" routerLink="/dashboard" [attr.aria-label]="i18n.t('welcome')"><span class="brand-mark" aria-hidden="true">P</span><span><strong>Pulse Vision</strong><small>RADAR ANALYTICS</small></span></a>
    <div class="nav-label">{{ i18n.t('workspace') }}</div>
    <nav class="navigation">
      <a routerLink="/start" routerLinkActive="active" ariaCurrentWhenActive="page"><span class="nav-icon" aria-hidden="true">⌂</span>{{ i18n.t('start') }}</a>
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page"><span class="nav-icon" aria-hidden="true">▦</span>{{ i18n.t('liveOverview') }}</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="environment"><span class="status-dot"></span><span>{{ i18n.t('localEnvironment') }}</span><span class="environment-tag">DEV</span></div>
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="breadcrumb"><span>Pulse Vision</span><span aria-hidden="true">/</span><strong>{{ i18n.t('workspace') }}</strong></div><div class="topbar-actions"><div class="connection"><span class="status-dot" [class.muted]="stream.status() !== 'connected'"></span>{{ connectionLabel() }}</div><div class="language-switch" role="group" [attr.aria-label]="i18n.t('language')"><button type="button" [class.selected]="i18n.language() === 'de'" [attr.aria-pressed]="i18n.language() === 'de'" (click)="setLanguage('de')">DE</button><button type="button" [class.selected]="i18n.language() === 'en'" [attr.aria-pressed]="i18n.language() === 'en'" (click)="setLanguage('en')">EN</button></div></div></header>
    <section class="page-content"><router-outlet /></section>
  </main>
</div>
