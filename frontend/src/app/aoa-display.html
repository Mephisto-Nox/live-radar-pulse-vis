<section class="aoa-panel" aria-labelledby="aoa-heading">
  <header class="panel-heading">
    <div class="panel-title"><span class="panel-mark aoa-mark" aria-hidden="true">◎</span><div><h2 id="aoa-heading">{{ i18n.t('aoaTitle') }}</h2><p>{{ i18n.t('aoaPending') }}</p></div></div>
    <span class="planned-badge">{{ i18n.t('aoaPending') }}</span>
  </header>
  <div class="polar-wrap">
    <svg class="polar-grid" viewBox="0 0 320 320" role="img" [attr.aria-label]="i18n.t('aoaTitle') + ' — ' + i18n.t('aoaPending')">
      <circle cx="160" cy="160" r="130" /><circle cx="160" cy="160" r="104" /><circle cx="160" cy="160" r="78" /><circle cx="160" cy="160" r="52" />
      <path d="M160 18V302M18 160H302M59.6 59.6 260.4 260.4M260.4 59.6 59.6 260.4" />
      <circle class="polar-origin" cx="160" cy="160" r="3" />
      <text x="160" y="14">0° · {{ i18n.t('north') }}</text><text x="307" y="164">90° · {{ i18n.t('east') }}</text>
      <text x="160" y="318">180° · {{ i18n.t('south') }}</text><text x="13" y="164">270° · {{ i18n.t('west') }}</text>
      <text class="ring-label" x="166" y="61">−40</text><text class="ring-label" x="166" y="113">−60</text><text class="ring-label" x="166" y="165">−80</text>
    </svg>
    <div class="polar-empty"><span aria-hidden="true">◎</span><strong>{{ i18n.t('aoaPending') }}</strong></div>
  </div>
  <footer class="aoa-footer"><span>−80 dBm</span><span>{{ i18n.t('amplitude') }}</span><span>−30 dBm</span></footer>
</section>
