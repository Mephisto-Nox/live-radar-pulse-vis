spring.application.name=pulse-vision-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.batch.size=262144
spring.kafka.producer.properties.buffer.memory=67108864
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.consumer.group-id=${KAFKA_WATERFALL_CONSUMER_GROUP:pulse-vision-waterfall-v1}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:latest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:1000}
spring.kafka.consumer.properties.max.poll.interval.ms=${KAFKA_MAX_POLL_INTERVAL_MS:600000}
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=batch
spring.task.scheduling.pool.size=${TASK_SCHEDULING_POOL_SIZE:2}
pulsevision.kafka.topic=${KAFKA_TOPIC:pdw-waterfall-v1}
pulsevision.kafka.waterfall-consumer-group=${KAFKA_WATERFALL_CONSUMER_GROUP:pulse-vision-waterfall-v1}
pulsevision.kafka.aoa-consumer-group=${KAFKA_AOA_CONSUMER_GROUP:pulse-vision-aoa-v1}
pulsevision.kafka.partitions=${KAFKA_PARTITIONS:16}
pulsevision.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
pulsevision.kafka.queue-capacity=${KAFKA_QUEUE_CAPACITY:4096}
pulsevision.udp.bind-address=${UDP_BIND_ADDRESS:0.0.0.0}
pulsevision.udp.port=${UDP_PORT:5005}
pulsevision.udp.receiver-id=${RECEIVER_ID:RX-01}
pulsevision.udp.receive-buffer-bytes=${UDP_RECEIVE_BUFFER_BYTES:4194304}
