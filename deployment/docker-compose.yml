services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
