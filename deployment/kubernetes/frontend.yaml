apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-vision-frontend
  labels:
    app.kubernetes.io/name: pulse-vision-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-vision-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-vision-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/mephisto-nox/radar-pulse-vis/frontend:REPLACE_WITH_TAG
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: pulse-vision-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
