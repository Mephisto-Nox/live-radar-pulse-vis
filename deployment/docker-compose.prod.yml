services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a published GHCR image}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pdw-waterfall-v1}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-latest}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-16}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:?Set KAFKA_REPLICATION_FACTOR for the target cluster}
      UDP_BIND_ADDRESS: ${UDP_BIND_ADDRESS:-0.0.0.0}
      UDP_PORT: ${UDP_PORT:-5005}
      RECEIVER_ID: ${RECEIVER_ID:?Set RECEIVER_ID}
    ports:
      - "${UDP_PORT:-5005}:${UDP_PORT:-5005}/udp"

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a published GHCR image}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - backend
